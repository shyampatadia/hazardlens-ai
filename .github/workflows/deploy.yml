name: Test, Deploy, and Notify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install pytest gradio huggingface_hub Pillow python-dotenv spaces

      - name: Run tests
        run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Deploy to Hugging Face
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: shyampatadia22/hazardlens-ai
          hf_token: ${{ secrets.HF_TOKEN }}

  notify:
    needs: [test, deploy]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Send success notification
        if: ${{ needs.test.result == 'success' && needs.deploy.result == 'success' }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SPACE_URL: https://huggingface.co/spaces/shyampatadia22/hazardlens-ai
        run: |
          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"✅ HazardLens deployed successfully. Tests passed and the Hugging Face Space was updated.\\nApp: $SPACE_URL\\nWorkflow: $WORKFLOW_URL\"}" \
            "$DISCORD_WEBHOOK"

      - name: Send failure notification
        if: ${{ needs.test.result != 'success' || needs.deploy.result != 'success' }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"❌ HazardLens deployment failed. Tests: $TEST_RESULT. Deployment: $DEPLOY_RESULT.\\nCheck the logs: $WORKFLOW_URL\"}" \
            "$DISCORD_WEBHOOK"
